{% extends "seller/base.html" %}

{% block nav_sales %}active{% endblock %}

{% block content %}
<h1>Mis Ventas</h1>

<div class="card">
    <h3>Historial de Órdenes</h3>
    <div class="table-responsive">
        <table id="salesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Cant.</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadSales() {
        try {
            const res = await fetch('/sales/', { headers: authHeaders() });
            const sales = await res.json();
            const tbody = document.querySelector('#salesTable tbody');
            tbody.innerHTML = '';

            sales.reverse().forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${s.id}</td>
                    <td>${s.customer_id}</td>
                    <td>${s.quantity}</td>
                    <td>₡${s.total_amount}</td>
                    <td>${new Date(s.created_at).toLocaleDateString()}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
        }
    }
    loadSales();
</script>
{% endblock %}
