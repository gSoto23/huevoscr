{% extends "seller/base.html" %}

{% block nav_cust %}active{% endblock %}

{% block content %}
<h1>Mis Clientes</h1>

<div style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
    <input type="text" id="searchInput" placeholder="Buscar cliente..."
        style="flex: 1; max-width: 400px; padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
    <button class="btn-primary" onclick="openCreateModal()">
        <i class="fa-solid fa-plus"></i> Agregar Cliente
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table id="customerTable">
            <thead>
                <tr>
                    <th>WhatsApp / ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Dirección</th>
                    <th>Ubicación</th>
                    <th>Forma de Pago</th>
                    <th>Cantidad</th>
                    <th>Día</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Create Modal -->
<div id="createModal" class="hidden"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200;">
    <div class="card"
        style="width: 90%; max-width: 500px; margin: 50px auto; padding: 20px; max-height: 90vh; overflow-y: auto;">
        <h3>Agregar Nuevo Cliente</h3>
        <p style="font-size: 0.9rem; color: #666;">Se asignará automáticamente a tu ruta.</p>

        <form id="createForm">
            <div class="form-group">
                <label>WhatsApp (ID) *</label>
                <input type="text" name="whatsapp_id" required pattern="\d{8}" maxlength="8" minlength="8"
                    placeholder="88888888">
            </div>
            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Dirección *</label>
                <textarea name="address" required></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Cantidad *</label>
                    <input type="number" name="cartons_qty" value="1" min="1" required>
                </div>
                <div class="form-group">
                    <label>Periodicidad *</label>
                    <select name="periodicity" required>
                        <option value="Semanal">Semanal</option>
                        <option value="Mensual">Mensual</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Forma de Pago *</label>
                    <select name="payment_method" required>
                        <option value="Sinpe">Sinpe</option>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email (Opcional)</label>
                    <input type="email" name="email">
                </div>
            </div>
            <div class="form-group">
                <label>Link Ubicación (Opcional)</label>
                <input type="text" name="location_pin" placeholder="https://maps...">
            </div>

            <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn-secondary" onclick="closeCreateModal()">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allCustomers = [];

    async function loadCustomers() {
        try {
            const res = await fetch('/customers/', { headers: authHeaders() });
            allCustomers = await res.json();
            renderTable(allCustomers);
        } catch (e) {
            console.error(e);
        }
    }

    function renderTable(customers) {
        const tbody = document.querySelector('#customerTable tbody');
        tbody.innerHTML = '';
        customers.forEach(c => {
            const tr = document.createElement('tr');

            // Format Location Link
            let locationHtml = '-';
            if (c.location_pin) {
                locationHtml = `<a href="${c.location_pin}" target="_blank" style="color: var(--color-red); text-decoration: none;">
                                    <i class="fa-solid fa-map-location-dot"></i> Ver
                                </a>`;
            }

            tr.innerHTML = `
                <td>${c.whatsapp_id}</td>
                <td>${c.name}</td>
                <td>${c.email || '-'}</td>
                <td style="font-size: 0.9rem; max-width: 200px;">${c.address}</td>
                <td>${locationHtml}</td>
                <td>${c.payment_method}</td>
                <td>${c.cartons_qty}</td>
                <td>${c.periodicity}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allCustomers.filter(c =>
            c.name.toLowerCase().includes(term) ||
            c.whatsapp_id.includes(term) ||
            c.address.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });

    function openCreateModal() {
        document.getElementById('createModal').style.display = 'block';
    }

    function closeCreateModal() {
        document.getElementById('createModal').style.display = 'none';
        document.getElementById('createForm').reset();
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        // Validate 8 digits
        if (!/^\d{8}$/.test(data.whatsapp_id)) {
            alert('El WhatsApp debe tener 8 dígitos');
            return;
        }

        // Cleanup empty optionals
        if (!data.email) delete data.email;
        if (!data.location_pin) delete data.location_pin;
        data.cartons_qty = parseInt(data.cartons_qty);

        try {
            const res = await fetch('/customers/', {
                method: 'POST',
                headers: {
                    ...authHeaders(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeCreateModal();
                loadCustomers();
                alert('Cliente creado exitosamente');
            } else {
                const err = await res.json();
                alert('Error: ' + (err.detail || 'No se pudo crear'));
            }
        } catch (e) {
            console.error(e);
            alert('Error de conexión');
        }
    });

    loadCustomers();
</script>
{% endblock %}
