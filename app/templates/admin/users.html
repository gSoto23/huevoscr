{% extends "admin/base.html" %}

{% block nav_users %}active{% endblock %}

{% block content %}
<h1>Gestión de Usuarios del Sistema</h1>

<div class="card" style="margin-bottom: 30px;">
    <h3>Crear Nuevo Usuario</h3>
    <form id="createUserForm" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
        <div class="form-group" style="margin: 0; flex: 1; min-width: 200px;">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group" style="margin: 0; flex: 1; min-width: 200px;">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group" style="margin: 0; min-width: 150px;">
            <label for="role">Rol</label>
            <select id="role" name="role" required>
                <option value="seller">Vendedor</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <button type="submit" class="btn-primary" style="height: 48px; border-radius: 8px;">Crear</button>
    </form>
    <div id="msg" class="hidden" style="margin-top: 10px;"></div>
</div>

<div class="card">
    <h3>Usuarios Existentes</h3>
    <div class="table-responsive">
        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const msgDiv = document.getElementById('msg');

    async function loadUsers() {
        try {
            const res = await fetch('/users/', { headers: authHeaders() });
            const users = await res.json();
            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = '';

            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>
                        <span style="background: ${u.role === 'admin' ? 'var(--color-red)' : 'var(--color-yellow)'}; 
                                     color: ${u.role === 'admin' ? '#fff' : '#000'}; 
                                     padding: 3px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: bold;">
                            ${u.role.toUpperCase()}
                        </span>
                    </td>
                    <td>${u.is_active ? 'Activo' : 'Inactivo'}</td>
                    <td>
                        <button onclick="deleteUser(${u.id})" class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem; background: #ddd; border-color: #ccc;">🗑</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
        }
    }
    loadUsers();

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));

        try {
            const res = await fetch('/users/', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify(data)
            });

            if (res.ok) {
                e.target.reset();
                loadUsers();
                msgDiv.textContent = "Usuario creado exitosamente.";
                msgDiv.className = "success-message";
                msgDiv.classList.remove('hidden');
            } else {
                const err = await res.json();
                msgDiv.textContent = "Error: " + err.detail;
                msgDiv.className = "error-message";
                msgDiv.classList.remove('hidden');
            }
        } catch (err) {
            console.error(err);
        }
    });

    async function deleteUser(id) {
        if (!confirm('¿Seguro que deseas eliminar este usuario?')) return;

        try {
            const res = await fetch('/users/' + id, {
                method: 'DELETE',
                headers: authHeaders()
            });
            if (res.ok) loadUsers();
            else {
                const err = await res.json();
                alert(err.detail);
            }
        } catch (e) {
            console.error(e);
        }
    }
</script>
{% endblock %}
