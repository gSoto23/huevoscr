{% extends "admin/base.html" %}

{% block nav_dash %}active{% endblock %}

{% block content %}
<h1>Dashboard Administrativo</h1>

<div class="stat-grid">
    <div class="stat-card">
        <h3>Total Clientes</h3>
        <div class="stat-number" id="total-clients">-</div>
    </div>
    <!-- Removed other stats for cleaner look as per "only customer list" request or kept minimal? 
         User said "only want the general list". 
         I will keep the Total Clients stat as it's relevant to the list, but focus on the table. -->
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0;">Lista General de Clientes</h3>
        <input type="text" id="searchInput" placeholder="Buscar..."
            style="padding: 8px 15px; border-radius: 20px; border: 1px solid #ccc; width: 200px;">
    </div>
    <div class="table-responsive">
        <table id="customerTable">
            <thead>
                <tr>
                    <th>WhatsApp / ID</th>
                    <th>Nombre</th>
                    <th>Cantidad</th>
                    <th>Día</th>
                    <th>Vendedor</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allCustomers = [];

    async function loadData() {
        try {
            const res = await fetch('/customers/', { headers: authHeaders() });
            allCustomers = await res.json();

            // Update Stat
            document.getElementById('total-clients').textContent = allCustomers.length;

            renderTable(allCustomers);
        } catch (e) {
            console.error(e);
        }
    }

    function renderTable(customers) {
        const tbody = document.querySelector('#customerTable tbody');
        tbody.innerHTML = '';

        customers.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${c.whatsapp_id}</td>
                <td>${c.name}</td>
                <td>${c.cartons_qty}</td>
                <td>${c.periodicity}</td>
                <td>${c.seller ? c.seller.username : 'Sin asignar'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allCustomers.filter(c => 
            c.name.toLowerCase().includes(term) || 
            c.whatsapp_id.includes(term) ||
            (c.seller && c.seller.username.toLowerCase().includes(term))
        );
        renderTable(filtered);
    });

    loadData();
</script>
{% endblock %}
